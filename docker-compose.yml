services:
  app:
    build: .
    container_name: estimate-app
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: ecto://postgres:postgres@postgres:5432/estimate
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-zmien_mnie_na_prawdziwy_klucz_64_znaki_minimum_wygeneruj_mix_phx_gen_secret}
      PHX_HOST: ${PHX_HOST:-localhost}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    container_name: estimate-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: estimate
    ports:
      - "5499:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d estimate"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
