include:
  - project: 'dacdigital/gitlab-ci'
    ref: master
    file:
      - 'templates/docker/.docker-build.yml'

variables:
  DOCKER_BUILD_ARGS: "--build-arg GIT_SHA=$CI_COMMIT_SHORT_SHA"

trigger_job:
  stage: deploy
  when: manual
  trigger:
    project: dacdigital/tools/deployment/estimate-deployment
    branch: master
