name: CI

# Safe for a public repo: `pull_request` runs fork code WITHOUT secrets and
# with a read-only GITHUB_TOKEN. Never switch this to `pull_request_target`.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        # config/test.exs hardcodes port 5499
        ports: ["5499:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "28.3.1"

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - run: mix deps.get

      - run: mix deps.unlock --check-unused

      - run: mix format --check-formatted

      - run: mix compile --warnings-as-errors

      # `mix test` alias runs ecto.create + ecto.migrate (migrations create the
      # estimate_app RLS role).
      - run: mix test
