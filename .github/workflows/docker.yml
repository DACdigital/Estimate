name: Docker

# Publish job holds credentials, so it triggers on push to any branch or tag
# in this repo plus manual dispatch. Fork PRs can never reach it (no
# pull_request trigger).
on:
  push:
    branches: ["**"]
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: docker.io/dacinfomotion/estimate

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tag scheme (branch names slugified by metadata-action — '/' → '-', etc.):
      #   main         → latest
      #   git tag      → <tag-name>  (e.g. git tag "1.0.42" → image "1.0.42")
      #   other branch → <branch-slug>
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch,enable=${{ github.ref_name != 'main' }}
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  # Publish Helm chart to OCI Docker Hub on every tag, after the image is up.
  # Chart tarball is versioned from the git tag (leading "v" stripped so
  # `helm package` accepts SemVer). Uses the same DOCKERHUB_* secrets as
  # build-push above — no new credentials needed.
  helm-publish:
    needs: build-push
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Helm registry login
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" \
            | helm registry login registry-1.docker.io \
                -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Helm dependency update
        working-directory: deploy/helm/estimate
        run: helm dependency update

      - name: Helm lint
        working-directory: deploy/helm/estimate
        run: |
          helm lint . \
            --set appSecret.secretKeyBase=lint-dummy \
            --set appSecret.encryptionKey=lint-dummy \
            --set appSecret.databaseRolePassword=lint-dummy \
            --set postgres.auth.password=lint-dummy

      - name: Helm package
        working-directory: deploy/helm/estimate
        run: |
          helm package . \
            --version "${{ steps.ver.outputs.version }}" \
            --app-version "${{ steps.ver.outputs.version }}" \
            --destination /tmp/helm-out

      - name: Helm push
        run: |
          helm push \
            "/tmp/helm-out/estimate-chart-${{ steps.ver.outputs.version }}.tgz" \
            oci://registry-1.docker.io/dacinfomotion
