{{- if .Values.appSecret.create }}
{{- if .Values.appSecret.existingSecretName }}
{{- fail "appSecret: set either create=true (chart-managed) OR existingSecretName (BYO), not both" }}
{{- end }}
{{- if not .Values.appSecret.secretKeyBase }}
{{- fail "appSecret.secretKeyBase is required when appSecret.create=true (generate with `mix phx.gen.secret`)" }}
{{- end }}
{{- if not .Values.appSecret.encryptionKey }}
{{- fail "appSecret.encryptionKey is required when appSecret.create=true (generate with `openssl rand -base64 32`)" }}
{{- end }}
{{- if not .Values.appSecret.databaseRolePassword }}
{{- fail "appSecret.databaseRolePassword is required when appSecret.create=true" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "estimate-chart.fullname" . }}-app
  labels:
    {{- include "estimate-chart.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY_BASE: {{ .Values.appSecret.secretKeyBase | quote }}
  ENCRYPTION_KEY: {{ .Values.appSecret.encryptionKey | quote }}
  DATABASE_ROLE_PASSWORD: {{ .Values.appSecret.databaseRolePassword | quote }}
  DATABASE_URL: {{ include "estimate-chart.databaseUrl" . | quote }}
  GOOGLE_CLIENT_ID: {{ .Values.appSecret.google.clientId | quote }}
  GOOGLE_CLIENT_SECRET: {{ .Values.appSecret.google.clientSecret | quote }}
{{- end }}
