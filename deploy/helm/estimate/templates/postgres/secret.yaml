{{- if .Values.postgres.enabled }}
{{- if not .Values.postgres.auth.existingSecretName }}
{{- if not .Values.postgres.auth.password }}
{{- fail "postgres.auth.password is required when postgres.enabled=true (or set postgres.auth.existingSecretName)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "estimate-chart.fullname" . }}-postgres
  labels:
    helm.sh/chart: {{ include "estimate-chart.chart" . }}
    app.kubernetes.io/name: {{ include "estimate-chart.name" . }}-postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: postgres
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.auth.password | quote }}
  POSTGRES_DB: {{ .Values.postgres.auth.database | quote }}
{{- end }}
{{- end }}
