name: estimate

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}"
      POSTGRES_DB: estimate
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d estimate"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  app:
    image: dacinfomotion/estimate:${ESTIMATE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "ecto://postgres:${POSTGRES_PASSWORD}@db:5432/estimate"
      SECRET_KEY_BASE: "${SECRET_KEY_BASE:?SECRET_KEY_BASE must be set in .env — run make secret}"
      PHX_HOST: "${PHX_HOST:-localhost}"
      PORT: "4000"
      PHX_SERVER: "true"
      POOL_SIZE: "${POOL_SIZE:-10}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:-}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
    ports:
      - "${APP_PORT:-4000}:4000"

volumes:
  pgdata:
